name: Reusable package release
on:
  workflow_call: null
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          node --input-type=module <<'RELEASE_VALIDATION'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '') || tag !== 'v' + version) {
            throw new Error('Release tag must match package.json version (vMAJOR.MINOR.PATCH).');
          }
          console.log('Release tag matches package version.');
          RELEASE_VALIDATION
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
      - name: Create GitHub release with installable package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" ./*.tgz --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
